<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body,#stage{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#stage{position:relative}.boot{position:absolute;inset:0;display:grid;place-items:center;background:#fff8f6;color:#725e66;font-size:13px;font-weight:700}.boot[hidden]{display:none}
</style>
<div id="stage"><div class="boot" id="boot">🐷 Preparing embedded Wurst…</div></div>
<script type="module">
import { WursterWeb, MessagePortWurstSource } from './wurster.min.js';
const stage = document.querySelector('#stage');
const boot = document.querySelector('#boot');
let session = null;
let unsubscribePigLink = null;
addEventListener('message', async (event) => {
  if (event.data?.type !== 'wurster-embed-init' || !event.ports?.[0]) return;
  const port = event.ports[0]; port.start?.();
  try {
    unsubscribePigLink?.(); unsubscribePigLink = null;
    await session?.close?.();
    const source = new MessagePortWurstSource(port, Number(event.data.size), { kind: event.data.sourceKind || 'embed' });
    const base = new URL('./', import.meta.url);
    let requestSeq = 1;
    const pendingPersist = new Map();
    const pendingParent = new Map();
    const pendingRuntime = new Map();
    const onBridgeResult = (message) => {
      const m = message.data;
      if (m?.type === 'wurster-embed-persist-result') {
        const pending = pendingPersist.get(m.id);
        if (!pending) return;
        pendingPersist.delete(m.id);
        m.ok ? pending.resolve(m.result) : pending.reject(new Error(m.error || 'Embedded Wurst persistence failed'));
        return;
      }
      if (m?.type === 'wurster-embed-runtime-result') {
        const pending = pendingRuntime.get(m.id);
        if (!pending) return;
        pendingRuntime.delete(m.id);
        if (m.ok) pending.resolve(m.result);
        else { const error = new Error(m.error || 'Desktop Wurst runtime operation failed'); error.code = m.code || null; pending.reject(error); }
        return;
      }
      if (m?.type === 'wurster-embed-parent-result') {
        const pending = pendingParent.get(m.id);
        if (!pending) return;
        pendingParent.delete(m.id);
        m.ok ? pending.resolve(m.result) : pending.reject(new Error(m.error || 'Parent Wurst operation failed'));
        return;
      }
      if (m?.type === 'wurster-embed-parent-piglink-event') {
        session?.deliverParentPigLinkEvent?.(String(m.name || ''), m.payload ?? null);
        return;
      }
      if (m?.type === 'wurster-embed-session-changed') {
        void (async () => {
          try {
            const result = await session?.refreshEmbeddedSource?.({
              size: Number(m.size),
              session: m.session || null
            });
            port.postMessage({ type: 'wurster-embed-session-refreshed', result });
          } catch (error) {
            port.postMessage({ type: 'wurster-embed-session-refresh-failed', error: error?.message || String(error), code: error?.code || null });
          }
        })();
        return;
      }
      if (m?.type === 'wurster-embed-child-call') {
        void (async () => {
          try {
            let result;
            if (m.method === 'piglink.describe') result = session?.describePigLink?.() ?? null;
            else if (m.method === 'piglink.invoke') result = await session?.invokePigLink?.(m.args?.[0], m.args?.[1] ?? {});
            else throw new Error(`Unsupported embedded child operation: ${m.method}`);
            port.postMessage({ type: 'wurster-embed-child-result', id: m.id, ok: true, result });
          } catch (error) {
            port.postMessage({ type: 'wurster-embed-child-result', id: m.id, ok: false, error: error?.message || String(error) });
          }
        })();
      }
    };
    port.addEventListener('message', onBridgeResult);
    session = await WursterWeb.open(source, {
      sessionId: event.data.session?.id || undefined,
      desktopVirtualRoutes: location.protocol === 'wurst:',
      wurstKey: event.data.wurstKey || null,
      serviceWorkerUrl: new URL('./wurster-sw.js', import.meta.url).toString(),
      serviceWorkerScope: base.pathname,
      runtimeInvoke: location.protocol === 'wurst:' ? async (method, args = []) => {
        const id = `runtime-${requestSeq++}`;
        const result = new Promise((resolve, reject) => pendingRuntime.set(id, { resolve, reject }));
        port.postMessage({ type: 'wurster-embed-runtime-call', id, method, args });
        return result;
      } : null,
      persistSnapshot: event.data.persistent ? async (blob) => {
        const data = await blob.arrayBuffer();
        const id = `persist-${requestSeq++}`;
        const result = new Promise((resolve, reject) => pendingPersist.set(id, { resolve, reject }));
        port.postMessage({ type: 'wurster-embed-persist', id, data }, [data]);
        return result;
      } : null,
      parent: event.data.parent || null,
      externalSession: event.data.session || null,
      parentInvoke: event.data.parent ? async (method, args = []) => {
        const id = `parent-${requestSeq++}`;
        const result = new Promise((resolve, reject) => pendingParent.set(id, { resolve, reject }));
        port.postMessage({ type: 'wurster-embed-parent-call', id, method, args });
        return result;
      } : null
    });
    unsubscribePigLink = session.onPigLinkEvent?.((name, payload) => {
      port.postMessage({ type: 'wurster-embed-child-event', name, payload });
    }) || null;
    boot.hidden = true;
    await session.mount(stage);
    port.postMessage({ type: 'wurster-embed-ready', detail: { manifest: session.reader.manifest, signature: session.signature, version: WursterWeb.version } });
  } catch (error) {
    boot.hidden = false; boot.textContent = `🌭 ${error?.message || String(error)}`;
    port.postMessage({ type: 'wurster-embed-error', error: error?.message || String(error) });
  }
});
</script>
