<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wurst Identity</title>
<style>
:root{color-scheme:light dark;--bg:#fffaf8;--ink:#30242a;--muted:#8a747d;--line:#ecdde0;--green:#237a57;--green-bg:#e8f7ef;--amber:#93672b;--amber-bg:#fff3dd;--red:#a13c4b;--red-bg:#ffe8eb;--grey:#6d6468;--grey-bg:#f2efef}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.seal{position:absolute;left:0;top:0;width:100%;height:100%;border:0;padding:0;background:transparent;cursor:pointer;text-align:left;color:var(--ink)}.plate{height:100%;min-height:52px;display:grid;grid-template-columns:38px minmax(0,1fr) 18px;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:15px;background:rgba(255,250,248,.985);box-shadow:0 5px 18px rgba(70,38,49,.08);transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}.seal:hover .plate,.seal:focus-visible .plate{transform:translateY(-1px);box-shadow:0 8px 22px rgba(70,38,49,.13);outline:none}.mark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:950;background:var(--grey-bg);color:var(--grey);box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}.copy{min-width:0}.publisher{font-size:12px;font-weight:840;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}.state{margin-top:2px;font-size:9px;font-weight:880;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hint{margin-top:2px;font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chev{font-size:15px;color:#b8a3ab;text-align:center}.verified .mark{background:var(--green-bg);color:var(--green)}.verified .state{color:var(--green)}.signed .mark{background:var(--amber-bg);color:var(--amber)}.signed .state{color:var(--amber)}.danger .mark{background:var(--red-bg);color:var(--red)}.danger .state{color:var(--red)}.warning .mark{background:var(--grey-bg);color:var(--grey)}.warning .state{color:var(--grey)}
@media(max-width:260px){.hint{display:none}.plate{grid-template-columns:34px minmax(0,1fr) 14px;padding:7px 8px;gap:7px}.mark{width:30px;height:30px}.publisher{font-size:11px}.state{font-size:8px}}
@media(prefers-color-scheme:dark){:root{--bg:#221a1d;--ink:#f5e9ed;--muted:#ae969f;--line:#4a373e;--green:#7dd7ad;--green-bg:#17382a;--amber:#e6ba72;--amber-bg:#443318;--red:#f08b9b;--red-bg:#4b2028;--grey:#c3b6bb;--grey-bg:#332a2d}.plate{background:rgba(34,26,29,.985);box-shadow:0 5px 18px rgba(0,0,0,.22)}}
</style>
</head>
<body>
<button class="seal warning" id="seal" type="button" aria-label="Verify Wurst identity in Wurster">
  <span class="plate">
    <span class="mark" id="mark">?</span>
    <span class="copy">
      <span class="publisher" id="publisher">Checking Wurst identity…</span>
      <span class="state" id="state">Wurster identity seal</span>
      <span class="hint" id="hint">Don't trust this Wurst? Click to ask Wurster.</span>
    </span>
    <span class="chev">›</span>
  </span>
</button>
<script>
(async()=>{
  const api=window.wursterIdentity,seal=document.getElementById('seal'),publisher=document.getElementById('publisher'),state=document.getElementById('state'),mark=document.getElementById('mark'),hint=document.getElementById('hint');
  window.addEventListener('wurster-identity-layout',(event)=>{const l=event.detail||{};seal.style.left=`${Number(l.x)||0}px`;seal.style.top=`${Number(l.y)||0}px`;seal.style.width=`${Math.max(1,Number(l.width)||1)}px`;seal.style.height=`${Math.max(1,Number(l.height)||1)}px`;});
  try{
    const ctx=await api.context(),trust=ctx.trust||{};
    seal.className=`seal ${['verified','signed','danger','warning'].includes(trust.level)?trust.level:'warning'}`;
    publisher.textContent=trust.publisher||ctx.name||'Unsigned Wurst';
    state.textContent=trust.label||'WURST IDENTITY';
    mark.textContent=trust.level==='verified'?'✓':trust.level==='danger'?'!':trust.level==='signed'?'◆':'?';
    hint.textContent=trust.level==='verified'?'Looks good. Click to confirm in Wurster.':"Don't trust this Wurst? Click to ask Wurster.";
    seal.title=[trust.label,trust.publisher,trust.detail,'Click to verify in Wurster'].filter(Boolean).join(' · ');
  }catch(error){
    seal.className='seal danger';mark.textContent='!';publisher.textContent='Identity unavailable';state.textContent='WURSTER COULD NOT VERIFY';hint.textContent='Click for the trusted verification window.';seal.title=error?.message||'Identity unavailable';
  }
  seal.addEventListener('click',async()=>{try{await api.verify()}catch(error){seal.title=error?.message||'Could not open Wurster verification'}});
})();
</script>
</body>
</html>
