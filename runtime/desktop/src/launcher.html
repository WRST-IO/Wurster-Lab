<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wurster</title>
<style>
:root{--ink:#2c2230;--muted:#8f7e86;--pork:#eb536f;--pork2:#f8b8c4;--cream:#fff8f7;--line:#f0d7db;--glass:rgba(255,248,247,.975);--green:#338f68;--danger:#b74758}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);overflow:hidden}button,input,textarea{font:inherit}.hidden{display:none!important}
.shell{height:100%;border:1px solid rgba(93,61,73,.18);border-radius:28px;background:var(--glass);box-shadow:0 24px 70px rgba(54,33,42,.25);overflow:hidden;perspective:1200px}.titlebar{position:absolute;z-index:20;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid rgba(130,90,103,.12);-webkit-app-region:drag;background:rgba(255,248,247,.82);backdrop-filter:blur(16px)}
.lights{display:flex;gap:9px}.light{width:13px;height:13px;border:0;border-radius:50%;padding:0;-webkit-app-region:no-drag}.red{background:#ff6259}.yellow{background:#ffbd2e}.green{background:#28c941;opacity:.75}.brand{font-size:14px;font-weight:780;color:#5a4a51}.stage{position:absolute;inset:52px 0 0;transform-style:preserve-3d;transition:transform .48s cubic-bezier(.2,.75,.2,1)}.stage.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden}.front{background:var(--glass)}.back{transform:rotateY(180deg);background:linear-gradient(145deg,#f8f7f4,#d9d8d4 48%,#f4f2ee);color:#302b31}.back:before{content:"";position:absolute;inset:0;opacity:.28;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(255,255,255,.7) 0 1px,rgba(0,0,0,.025) 1px 3px)}
.main{position:relative;padding:22px 25px 18px;display:flex;flex-direction:column;align-items:center;height:100%}.pig{width:73px;height:73px;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(194,91,112,.16));margin:0 0 8px}.title{font-size:24px;font-weight:850;letter-spacing:-.04em}.sub{font-size:12px;color:var(--muted);margin:5px 0 15px}.drop{width:100%;height:135px;border:1.5px dashed #e7bdc5;border-radius:20px;background:#fffdfd;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.16s ease;-webkit-app-region:no-drag;outline:none}.drop:hover,.drop.drag{border-color:var(--pork);background:#fff4f6;transform:translateY(-1px)}.sausage{font-size:28px;margin-bottom:7px}.drop strong{font-size:14px}.drop span{font-size:11px;color:var(--muted);margin-top:4px;text-align:center}.footer{width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:11px}.tiny{border:0;background:transparent;color:#8c6973;font-weight:760;font-size:11px;cursor:pointer;padding:7px 8px;border-radius:11px}.tiny:hover{background:#fbe9ed;color:#b64059}.version{font-size:10px;color:#b49ca4}
.grinder-main{position:relative;height:100%;padding:12px 23px 13px;display:flex;flex-direction:column;align-items:center}.grinder-top{width:100%;display:flex;justify-content:space-between;align-items:center}.back-button{border:0;background:rgba(255,255,255,.45);border-radius:10px;padding:6px 9px;font-size:10px;font-weight:800;color:#625d5b;cursor:pointer}.grinder-label{font-size:10px;font-weight:900;letter-spacing:.13em;color:#6a6461}.grinder-wrap{height:70px;display:grid;place-items:center}.grinder{width:86px;max-height:69px;object-fit:contain;filter:drop-shadow(0 8px 11px rgba(52,46,47,.18));transform-origin:50% 80%}.grinding .grinder{animation:rumble .115s linear infinite}@keyframes rumble{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-2px,1px) rotate(-.7deg)}50%{transform:translate(2px,-1px) rotate(.5deg)}75%{transform:translate(-1px,-1px) rotate(.4deg)}}.grinder-title{font-size:18px;font-weight:900;letter-spacing:-.035em;margin-top:-1px}.grinder-tag{font-size:9px;color:#71696c;margin:1px 0 6px}.source{width:100%;height:48px;border:1px solid #b9b7b4;border-radius:13px;background:rgba(255,255,255,.68);display:flex;align-items:center;gap:10px;padding:0 12px;cursor:pointer;text-align:left;color:#302b31}.source.drag{border-color:#77726f;background:white}.source .icon{font-size:18px}.copy{min-width:0}.copy strong{font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.copy span{font-size:8px;color:#786f73;display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.signer{width:100%;height:37px;margin-top:6px;border:1px solid rgba(125,116,114,.35);border-radius:11px;background:rgba(255,255,255,.48);display:flex;align-items:center;gap:9px;padding:0 10px;text-align:left;cursor:pointer;color:#413a3d}.signer:hover{background:rgba(255,255,255,.78)}.signer-icon{font-size:15px}.signer-copy{min-width:0;flex:1}.signer-copy strong{display:block;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.signer-copy span{display:block;font-size:7.5px;color:#776e70;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.signer-badge{font-size:7px;font-weight:900;padding:3px 5px;border-radius:999px;background:#eee8e7;color:#776e70}.signer-badge.verified{background:#e0f2e9;color:#287251}.signer-badge.conflict{background:#ffe5e8;color:#a83f50}
.grinder-row{width:100%;display:grid;grid-template-columns:1fr 104px;gap:8px;margin-top:6px}.carrier{height:40px;border:1px dashed #c6aeb4;border-radius:11px;background:rgba(255,250,250,.65);cursor:pointer;color:#7c6570;font-size:8px;font-weight:850;padding:3px}.carrier.drag{border-color:var(--pork);color:var(--pork)}.start{height:40px;border:0;border-radius:11px;background:#343333;color:white;font-weight:900;font-size:10px;cursor:pointer}.start:disabled{opacity:.42}.progress-shell{width:100%;height:5px;border-radius:9px;background:rgba(89,84,82,.14);overflow:hidden;margin-top:7px}.progress{height:100%;width:0;background:linear-gradient(90deg,#d94862,#f07188);transition:width .2s ease}.status{min-height:24px;width:100%;font:8px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;color:#655e60;padding-top:5px}.grinder-foot{margin-top:auto;width:100%;display:flex;justify-content:space-between;align-items:center;font-size:8px;color:#81797b}.reveal{border:0;background:transparent;color:#b53e55;font-size:8px;font-weight:850;cursor:pointer;padding:4px 0}.pill{padding:3px 6px;border-radius:999px;background:rgba(255,255,255,.48);border:1px solid rgba(130,125,123,.18)}
.scrim{position:absolute;z-index:50;inset:52px 0 0;background:rgba(63,49,54,.2);backdrop-filter:blur(8px);display:grid;place-items:center;padding:13px}.modal{width:100%;max-height:100%;overflow:auto;background:#fffafa;border:1px solid #e5d8da;border-radius:18px;padding:15px;box-shadow:0 22px 60px rgba(58,39,44,.22)}.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.modal h2{font-size:16px;margin:0;letter-spacing:-.02em}.modal .lead{font-size:8.5px;line-height:1.4;color:#817579;margin:3px 0 10px}.modal-close{border:0;background:transparent;font-size:18px;color:#95888c;cursor:pointer}.signer-option{width:100%;border:1px solid #eee1e3;background:white;border-radius:11px;padding:9px;display:flex;align-items:center;gap:8px;text-align:left;margin-top:6px;cursor:pointer}.signer-option:hover,.signer-option.selected{border-color:#e7a5b2;background:#fff5f7}.signer-option .radio{width:18px;height:18px;border-radius:50%;background:#f3ebed;display:grid;place-items:center;font-size:9px}.signer-option.selected .radio{background:var(--pork);color:white}.signer-option .opt-copy{min-width:0;flex:1}.signer-option strong{display:block;font-size:9px}.signer-option span{display:block;font-size:7.5px;color:#86787d;margin-top:2px}.modal-actions{display:flex;gap:6px;margin-top:10px;align-items:center}.m-button{border:1px solid #eadbdd;background:white;color:#685c60;border-radius:9px;padding:7px 9px;font-size:8px;font-weight:800;cursor:pointer}.m-button.primary{background:var(--pork);border-color:var(--pork);color:white}.m-button.link{border:0;background:transparent;color:#a54d60;padding-left:0}.field{margin-top:8px}.field label{font-size:7.5px;font-weight:800;color:#776b6f;display:block;margin-bottom:4px}.field input,.field textarea{width:100%;border:1px solid #e8dadd;background:white;border-radius:9px;padding:8px;color:#3e3539;outline:none;font-size:9px}.field textarea{min-height:52px;resize:none;font:8px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}.field input:focus,.field textarea:focus{border-color:#e594a5;box-shadow:0 0 0 3px rgba(235,83,111,.08)}.dnsbox,.recoverybox{margin-top:8px;border-radius:10px;padding:8px;background:#f7f2f2;border:1px solid #ece0e1;font:7.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}.recoverybox{background:#fff2f4;border-color:#f0d5db}.modal-error{min-height:12px;margin-top:6px;font-size:8px;color:var(--danger)}
</style>
</head>
<body>
<div class="shell" id="shell">
  <div class="titlebar"><div class="lights"><button class="light red" id="close" aria-label="Close"></button><button class="light yellow" id="min" aria-label="Minimize"></button><span class="light green"></span></div><div class="brand" id="brand">Wurster</div><div style="width:53px"></div></div>
  <div class="stage" id="stage">
    <section class="face front"><main class="main"><img class="pig" src="../build/icons/wurster.png" alt="Wurster pig"><div class="title">Feed the pig.</div><div class="sub">Open a Wurst. Nothing else required.</div><button class="drop" id="drop" type="button"><div class="sausage">🌭</div><strong>Drop a Wurst here</strong><span>or click to choose a .wurst / .wrst / Undercover PNG</span></button><div class="footer"><button class="tiny" id="identities">🐷 Identities</button><button class="tiny" id="flipToGrinder">⚙️ MeatGrinder</button><span class="version">0.32.0</span></div></main></section>
    <section class="face back"><main class="grinder-main" id="grinderMain"><div class="grinder-top"><button class="back-button" id="flipBack">← Wurster</button><span class="grinder-label">MEATGRINDER</span></div><div class="grinder-wrap"><img class="grinder" src="meatgrinder.png" alt="MeatGrinder"></div><div class="grinder-title">Turn it into Wurst.</div><div class="grinder-tag">Folder or ZIP in. One portable file out.</div><button class="source" id="source"><span class="icon">📁</span><span class="copy"><strong>No project yet</strong><span>Drop folder / ZIP or click</span></span></button><button class="signer" id="signer"><span class="signer-icon">🔏</span><span class="signer-copy"><strong>Unsigned</strong><span>No publisher signature</span></span><span class="signer-badge">DEFAULT</span></button><div class="grinder-row"><button class="carrier" id="carrier">🥷 Optional image<br>PNG / JPEG</button><button class="start" id="start" disabled>Start Grinder</button></div><div class="progress-shell"><div class="progress" id="progress"></div></div><div class="status" id="status">The grinder is suspiciously quiet.</div><div class="grinder-foot"><span class="pill">wurst.json optional</span><button class="reveal" id="reveal" hidden>Show Wurst →</button></div></main></section>
  </div>
  <div id="scrim" class="scrim hidden"><div id="modal" class="modal"></div></div>
</div>
<script>
const launcher=window.wursterLauncher,grinder=window.meatGrinder,$=s=>document.querySelector(s);const drop=$('#drop'),stage=$('#stage');let hasSource=false,busy=false,signerCtx={selectedId:null,signers:[]};
function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}function stop(e){e.preventDefault();e.stopPropagation()}function bindDrop(el,cb){['dragenter','dragover','dragleave','drop'].forEach(t=>el.addEventListener(t,stop));['dragenter','dragover'].forEach(t=>el.addEventListener(t,()=>el.classList.add('drag')));['dragleave','drop'].forEach(t=>el.addEventListener(t,()=>el.classList.remove('drag')));el.addEventListener('drop',async e=>{const f=e.dataTransfer?.files?.[0];if(f)await cb(f)})}function pathName(p){return String(p||'').split(/[\\/]/).filter(Boolean).pop()||p}
function closeModal(){$('#scrim').classList.add('hidden');$('#modal').innerHTML=''}function openModal(html){$('#modal').innerHTML=html;$('#scrim').classList.remove('hidden');$('#modal').querySelector('[data-close]')?.addEventListener('click',closeModal)}
function authorityClaims(s){return Array.isArray(s?.authority?.claims)?s.authority.claims:[]}function hasAuthorityClaim(s,type){return authorityClaims(s).some(c=>c.type===type)}function verificationText(s){if(s?.authority?.verified){const claims=authorityClaims(s).map(c=>c.type==='domain'?c.value:c.type==='email'?c.value:c.type).join(' + ');return `Verified by WRST.IO${claims?` · ${claims}`:''}`}const v=s?.verification;if(!s?.domain)return s?.email?'Email not verified':'Local signing key';if(v?.verified)return v.status==='previously-verified'?'Direct DNS verified before':'Direct DNS verified';if(v?.conflict)return 'DNS identity conflict';if(v?.status==='unavailable')return 'DNS unavailable';if(v?.status==='unverified')return 'Domain not verified';return 'Domain not checked'}function signerName(s){return s?.domain||s?.email||s?.label||`${String(s?.fingerprint||'').slice(0,12)}…`}
function paintSigner(){const s=signerCtx.signers.find(x=>x.id===signerCtx.selectedId);const b=$('#signer'),badge=b.querySelector('.signer-badge');b.querySelector('strong').textContent=s?signerName(s):'Unsigned';b.querySelector('.signer-copy span').textContent=s?verificationText(s):'No publisher signature';badge.className='signer-badge';if(!s){badge.textContent='DEFAULT';return}if(s.authority?.verified){badge.textContent='WRST.IO';badge.classList.add('verified')}else if(s.verification?.verified){badge.textContent='DNS';badge.classList.add('verified')}else if(s.verification?.conflict){badge.textContent='CONFLICT';badge.classList.add('conflict')}else badge.textContent='SIGNED'}
async function refreshSigners(){signerCtx=await grinder.signers();paintSigner()}
function showSignerPicker(){const rows=[`<button class="signer-option ${!signerCtx.selectedId?'selected':''}" data-signer=""><span class="radio">${!signerCtx.selectedId?'✓':''}</span><span class="opt-copy"><strong>Unsigned</strong><span>Plain Wurst. No publisher signature.</span></span></button>`];for(const s of signerCtx.signers)rows.push(`<button class="signer-option ${signerCtx.selectedId===s.id?'selected':''}" data-signer="${esc(s.id)}"><span class="radio">${signerCtx.selectedId===s.id?'✓':''}</span><span class="opt-copy"><strong>${esc(signerName(s))}</strong><span>${esc(verificationText(s))} · ${esc(String(s.fingerprint).slice(0,12))}…</span></span></button>`);openModal(`<div class="modal-head"><div><h2>Sign this Wurst</h2><p class="lead">Unsigned is the default. Stored publisher keys never enter the Wurst.</p></div><button class="modal-close" data-close>×</button></div>${rows.join('')}<div class="modal-actions"><button id="newSigner" class="m-button primary">＋ New signer</button>${signerCtx.selectedId?'<button id="verifyWrst" class="m-button">✓ Verify with WRST.IO</button>':''}<button id="manageSigners" class="m-button">Manage identities</button></div>`);document.querySelectorAll('[data-signer]').forEach(b=>b.onclick=async()=>{const id=b.dataset.signer||null;await grinder.selectSigner(id);await refreshSigners();closeModal()});$('#newSigner').onclick=showNewSigner;if($('#verifyWrst'))$('#verifyWrst').onclick=()=>{const s=signerCtx.signers.find(x=>x.id===signerCtx.selectedId);if(s)showAuthoritySigner(s)};$('#manageSigners').onclick=()=>launcher.identities()}
function claimRows(s){const claims=authorityClaims(s);return claims.length?`<div class="dnsbox"><strong>WRST.IO verified claims</strong><br>${claims.map(c=>`✓ ${esc(c.type)}: ${esc(c.value)}`).join('<br>')}</div>`:'<div class="dnsbox">No WRST.IO verified claims yet.</div>'}
function showAuthoritySigner(s){openModal(`<div class="modal-head"><div><h2>WRST.IO verification</h2><p class="lead">WRST.IO turns a live ownership proof into an offline-verifiable certificate attached to Würste signed with this key.</p></div><button class="modal-close" data-close>×</button></div><strong style="font-size:10px">${esc(signerName(s))}</strong>${claimRows(s)}<div id="authorityState" class="modal-error"></div><div class="modal-actions">${s.domain&&!hasAuthorityClaim(s,'domain')?'<button id="authorityDomain" class="m-button">Verify domain</button>':''}${s.email&&!hasAuthorityClaim(s,'email')?'<button id="authorityEmail" class="m-button">Verify email</button>':''}<button id="authorityBack" class="m-button primary">Done</button></div>`);$('#authorityBack').onclick=async()=>{await refreshSigners();showSignerPicker()};if($('#authorityDomain'))$('#authorityDomain').onclick=async()=>{try{const r=await grinder.beginAuthorityDomain(s.id);showAuthorityDomainChallenge(s,r)}catch(e){$('#authorityState').textContent=e.message}};if($('#authorityEmail'))$('#authorityEmail').onclick=async()=>{try{const r=await grinder.beginAuthorityEmail(s.id);showAuthorityEmailChallenge(s,r)}catch(e){$('#authorityState').textContent=e.message}}}
function showAuthorityDomainChallenge(s,r){const d=r?.dns;openModal(`<div class="modal-head"><div><h2>Prove domain ownership</h2><p class="lead">Add this TXT record. WRST.IO will check it once, then the signed certificate works offline.</p></div><button class="modal-close" data-close>×</button></div><div class="dnsbox">${esc(d?.name||'')} TXT<br>"${esc(d?.value||'')}"</div><div id="authorityState" class="modal-error"></div><div class="modal-actions"><button id="domainBack" class="m-button">Back</button><button id="domainComplete" class="m-button primary">I added it · certify</button></div>`);$('#domainBack').onclick=()=>showAuthoritySigner(s);$('#domainComplete').onclick=async()=>{try{const updated=await grinder.completeAuthorityDomain(s.id);await refreshSigners();showAuthoritySigner(updated)}catch(e){$('#authorityState').textContent=e.message}}}
function showAuthorityEmailChallenge(s,r){openModal(`<div class="modal-head"><div><h2>Check your mail</h2><p class="lead">WRST.IO sent a six-digit code from oink@wrst.io to ${esc(r?.email||s.email)}. The code expires shortly.</p></div><button class="modal-close" data-close>×</button></div><div class="field"><label>6-DIGIT CODE</label><input id="authorityCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></div><div id="authorityState" class="modal-error"></div><div class="modal-actions"><button id="emailBack" class="m-button">Back</button><button id="emailComplete" class="m-button primary">Verify email</button></div>`);$('#emailBack').onclick=()=>showAuthoritySigner(s);$('#emailComplete').onclick=async()=>{try{const updated=await grinder.completeAuthorityEmail(s.id,$('#authorityCode').value);await refreshSigners();showAuthoritySigner(updated)}catch(e){$('#authorityState').textContent=e.message}}}
function showNewSigner(){openModal(`<div class="modal-head"><div><h2>New signing identity</h2><p class="lead">Create an Ed25519 publisher key and keep it in this Wurster's secure Meat Locker.</p></div><button class="modal-close" data-close>×</button></div><div class="field"><label>Label</label><input id="signLabel" maxlength="120" placeholder="Your Wurst Studio"></div><div class="field"><label>Domain · optional</label><input id="signDomain" placeholder="yourwurstdomain.tld"></div><div class="field"><label>Email · optional</label><input id="signEmail" placeholder="dev@yourwurstdomain.tld"></div><div class="field"><label>Publisher Meatphrase · optional</label><textarea id="signPhrase" spellcheck="false" placeholder="Paste your Meatphrase, or leave empty and Wurster generates one."></textarea></div><div class="modal-error" id="signErr"></div><div class="modal-actions"><button id="backSigners" class="m-button">Back</button><button id="createSigner" class="m-button primary">Create & use</button></div>`);$('#backSigners').onclick=showSignerPicker;$('#createSigner').onclick=async()=>{try{const r=await grinder.addSigner({label:$('#signLabel').value,domain:$('#signDomain').value,email:$('#signEmail').value,meatphrase:$('#signPhrase').value});await refreshSigners();showSignerCreated(r)}catch(e){$('#signErr').textContent=e.message}}}
function showSignerCreated(s){const recovery=s.generatedMeatphrase?`<div class="recoverybox"><strong>Generated Publisher Meatphrase</strong><br>${esc(s.generatedMeatphrase)}<br><br>Wurster stores it securely. For portable backup, export the .wurstkey from Identities and keep this Meatphrase with it.</div>`:'';const dns=s.dns?`<div class="dnsbox">${esc(s.dns.name)} TXT<br>"${esc(s.dns.value)}"</div>`:'';openModal(`<div class="modal-head"><div><h2>Signing identity ready</h2><p class="lead">${esc(signerName(s))} · ${esc(String(s.fingerprint).slice(0,20))}…</p></div><button class="modal-close" data-close>×</button></div>${recovery}${dns}<div id="verifyState" class="modal-error"></div><div class="modal-actions">${s.domain?'<button id="verifyNow" class="m-button">Check DNS</button>':''}<button id="doneSigner" class="m-button primary">Use signer</button></div>`);if(s.domain)$('#verifyNow').onclick=async()=>{try{const v=await grinder.verifySigner(s.id);$('#verifyState').textContent=verificationText(v);await refreshSigners()}catch(e){$('#verifyState').textContent=e.message}};$('#doneSigner').onclick=closeModal}
bindDrop(drop,async file=>{try{await launcher.openFile(file)}catch(err){drop.querySelector('span:last-child').textContent=err.message||String(err)}});drop.onclick=()=>launcher.choose();$('#identities').onclick=()=>launcher.identities();$('#min').onclick=()=>launcher.minimize();$('#close').onclick=()=>launcher.close();
$('#flipToGrinder').onclick=async()=>{stage.classList.add('flipped');$('#brand').textContent='MeatGrinder';await refreshSigners().catch(()=>{})};$('#flipBack').onclick=()=>{stage.classList.remove('flipped');$('#brand').textContent='Wurster'};$('#signer').onclick=async()=>{await refreshSigners();showSignerPicker()};
async function setSourceFile(file){try{const p=await grinder.useDroppedSource(file);hasSource=true;$('#source strong').textContent=pathName(p);$('#source .copy span').textContent='Ready to grind';$('#start').disabled=false}catch(e){$('#status').textContent=e.message}}async function setCarrierFile(file){try{const p=await grinder.useDroppedCarrier(file);$('#carrier').textContent=`🥷 ${pathName(p)}`}catch(e){$('#status').textContent=e.message}}
bindDrop($('#source'),setSourceFile);bindDrop($('#carrier'),setCarrierFile);$('#source').onclick=async()=>{const p=await grinder.chooseSource();if(p){hasSource=true;$('#source strong').textContent=pathName(p);$('#source .copy span').textContent='Ready to grind';$('#start').disabled=false}};$('#carrier').onclick=async()=>{const p=await grinder.chooseCarrier();if(p)$('#carrier').textContent=`🥷 ${pathName(p)}`};$('#start').onclick=async()=>{if(busy)return;try{busy=true;$('#start').disabled=true;$('#reveal').hidden=true;await grinder.build()}catch(e){$('#status').textContent=e.message}finally{busy=false;$('#start').disabled=!hasSource}};$('#reveal').onclick=()=>grinder.reveal();$('#scrim').onclick=e=>{if(e.target===$('#scrim'))closeModal()};
grinder.onState(s=>{busy=!!s.busy||s.phase==='grinding';$('#grinderMain').classList.toggle('grinding',busy);$('#progress').style.width=`${Math.max(0,Math.min(1,Number(s.progress)||0))*100}%`;if(s.message)$('#status').textContent=s.message;if(s.phase==='done'){$('#reveal').hidden=false;$('#start').textContent='Grind again'}else if(s.phase==='grinding')$('#start').textContent='Grinding…';else $('#start').textContent='Start Grinder'});refreshSigners().catch(()=>{});
</script>
</body>
</html>
