<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wurster Update</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--ink:#392a31;--muted:#896f79;--paper:#fff9f9;--canvas:#fff0f2;--line:#f1d9de;--pork:#e95673;--soft:#fde0e6}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--ink)}body{display:grid;place-items:center;padding:16px;-webkit-app-region:drag}.card{width:100%;height:100%;border:1px solid rgba(226,158,172,.45);border-radius:26px;background:linear-gradient(160deg,#fffafa 0%,#fff0f2 100%);box-shadow:0 28px 70px rgba(99,53,68,.16);padding:34px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;overflow:hidden}.pig{font-size:52px;animation:bob 1.1s ease-in-out infinite;filter:drop-shadow(0 6px 9px rgba(176,79,99,.12))}.title{font-size:24px;font-weight:820;letter-spacing:-.04em;margin-top:12px}.message{font-size:12px;line-height:1.55;color:var(--muted);max-width:360px;margin-top:7px}.track{width:min(330px,82%);height:12px;border-radius:999px;background:#f3dce1;overflow:hidden;margin-top:24px;box-shadow:inset 0 1px 2px rgba(92,48,61,.08)}.bar{height:100%;width:2%;border-radius:inherit;background:linear-gradient(90deg,#ed7890,#e95673);transition:width .18s ease}.foot{font-size:10px;color:#a18891;margin-top:10px;min-height:16px}.sausage{position:absolute;font-size:20px;opacity:.18;animation:float 4s ease-in-out infinite}.s1{top:20px;left:26px;transform:rotate(-18deg)}.s2{right:26px;bottom:22px;animation-delay:-1.7s;transform:rotate(22deg)}@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}@keyframes float{0%,100%{translate:0 0}50%{translate:0 -9px}}</style>
</head>
<body>
<div class="card">
  <div class="sausage s1">🌭</div><div class="sausage s2">🌭</div>
  <div class="pig">🐷</div>
  <div id="title" class="title">Oink oink…</div>
  <div id="message" class="message">Wurster found a fresh runtime and is getting it ready.</div>
  <div class="track"><div id="bar" class="bar"></div></div>
  <div id="foot" class="foot">Preparing the trough…</div>
</div>
<script>
(()=>{const title=document.querySelector('#title'),message=document.querySelector('#message'),bar=document.querySelector('#bar'),foot=document.querySelector('#foot');const pct=v=>Math.max(0,Math.min(100,Number(v)||0));function render(state={}){const p=pct(state.percent);bar.style.width=`${Math.max(2,p)}%`;if(state.phase==='available'){title.textContent='Oink oink… update found!';message.textContent=`Wurster ${state.version||'new'} is fresh from the release oven. Downloading it now.`;foot.textContent='0% · sharpening the sausage knives';return}if(state.phase==='downloading'){title.textContent='Oink oink… downloading';message.textContent='A newer Wurster runtime is being loaded. Your Wursts and local settings stay where they are.';foot.textContent=`${Math.round(p)}% · ${p<34?'sniffing the package':p<75?'packing the pork':'almost crispy'}`;return}if(state.phase==='ready'){title.textContent='Oink oink… ready!';message.textContent='Update downloaded and verified. Wurster is restarting into the fresh runtime.';foot.textContent='100% · serving the new Wurster';return}if(state.phase==='error'){title.textContent='Update snout hit a wall';message.textContent='The update could not be loaded right now. Wurster will continue with the installed version.';foot.textContent=state.message||'Try again on the next launch.';bar.style.width='2%'}}window.wursterUpdate?.onState(render)})();
</script>
</body>
</html>
