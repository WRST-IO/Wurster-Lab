<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body,#stage{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#stage{position:relative}.boot{position:absolute;inset:0;display:grid;place-items:center;background:#fff8f6;color:#725e66;font-size:13px;font-weight:700}.boot[hidden]{display:none}
</style>
<div id="stage"><div class="boot" id="boot">🐷 Preparing embedded Wurst…</div></div>
<script type="module">
import { WursterWeb, MessagePortWurstSource } from './wurster.min.js';
const stage = document.querySelector('#stage');
const boot = document.querySelector('#boot');
let session = null;
addEventListener('message', async (event) => {
  if (event.data?.type !== 'wurster-embed-init' || !event.ports?.[0]) return;
  const port = event.ports[0]; port.start?.();
  try {
    await session?.close?.();
    const source = new MessagePortWurstSource(port, Number(event.data.size), { kind: event.data.sourceKind || 'embed' });
    const base = new URL('./', import.meta.url);
    session = await WursterWeb.open(source, {
      wurstKey: event.data.wurstKey || null,
      serviceWorkerUrl: new URL('./wurster-sw.js', import.meta.url).toString(),
      serviceWorkerScope: base.pathname
    });
    boot.hidden = true;
    await session.mount(stage);
    port.postMessage({ type: 'wurster-embed-ready', detail: { manifest: session.reader.manifest, signature: session.signature, version: WursterWeb.version } });
  } catch (error) {
    boot.hidden = false; boot.textContent = `🌭 ${error?.message || String(error)}`;
    port.postMessage({ type: 'wurster-embed-error', error: error?.message || String(error) });
  }
});
</script>
