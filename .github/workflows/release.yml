name: Release Wurster Runtime

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: runtime-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify release tag
        run: node tools/release-check.mjs "$GITHUB_REF_NAME"
      - name: Install workspace dependencies
        run: npm install
      - name: Run release gate
        run: npm test

  web:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install
      - name: Build Wurster Web distribution
        run: |
          npm run authority:sync
          npm run runtime:web:build
      - name: Stage Wurster Web release assets
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          mkdir -p release-web
          cp runtime/web/dist/wurster.js release-web/
          cp runtime/web/dist/wurster.min.js release-web/
          cp runtime/web/dist/wurster-sw.js release-web/
          cp runtime/web/dist/wurster-embed.js release-web/
          cp runtime/web/dist/wurster-embed-host.html release-web/
          cp runtime/web/dist/trust-data.mjs release-web/
          (
            cd release-web
            zip -9 "Wurster-Web-${version}.zip" \
              wurster.js wurster.min.js wurster-sw.js wurster-embed.js \
              wurster-embed-host.html trust-data.mjs
          )
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-web
          path: release-web/*
          if-no-files-found: error
          compression-level: 0

  mac-arm64:
    needs: validate
    runs-on: macos-latest
    env:
      WURSTER_MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      WURSTER_MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      WURSTER_MAC_NOTARIZE: 'true'
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install

      - name: Require macOS signing and notarization secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WURSTER_MAC_CSC_LINK" || { echo "Missing MAC_CSC_LINK" >&2; exit 1; }
          test -n "$WURSTER_MAC_CSC_KEY_PASSWORD" || { echo "Missing MAC_CSC_KEY_PASSWORD" >&2; exit 1; }
          test -n "$APPLE_ID" || { echo "Missing APPLE_ID" >&2; exit 1; }
          test -n "$APPLE_APP_SPECIFIC_PASSWORD" || { echo "Missing APPLE_APP_SPECIFIC_PASSWORD" >&2; exit 1; }
          test -n "$APPLE_TEAM_ID" || { echo "Missing APPLE_TEAM_ID" >&2; exit 1; }

      - name: Prepare hardened Electron entitlements
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p runtime/desktop/build

          cat > runtime/desktop/build/entitlements.mac.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
          </dict>
          </plist>
          PLIST

          cp runtime/desktop/build/entitlements.mac.plist \
             runtime/desktop/build/entitlements.mac.inherit.plist

          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';

          const file = 'runtime/desktop/package.json';
          const pkg = JSON.parse(await fs.readFile(file, 'utf8'));

          pkg.build ??= {};
          pkg.build.mac ??= {};
          pkg.build.mac.hardenedRuntime = true;
          pkg.build.mac.entitlements = 'build/entitlements.mac.plist';
          pkg.build.mac.entitlementsInherit = 'build/entitlements.mac.inherit.plist';

          await fs.writeFile(file, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Build signed and notarized macOS arm64
        run: npm run dist:mac:arm64


      - name: Verify signed and notarized app
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/wurster-verify-arm64"
          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"

          zip_file=$(find runtime/mac/dist -maxdepth 1 -name 'Wurster-*-mac-arm64.zip' -print -quit)
          test -n "$zip_file" || { echo "macOS arm64 ZIP not found" >&2; exit 1; }

          ditto -x -k "$zip_file" "$verify_dir"
          app=$(find "$verify_dir" -maxdepth 2 -name 'Wurster.app' -print -quit)
          test -n "$app" || { echo "Wurster.app not found in arm64 ZIP" >&2; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --verbose --type exec "$app"
          xcrun stapler validate "$app"

      - uses: actions/upload-artifact@v7
        with:
          name: runtime-mac-arm64
          path: |
            runtime/mac/dist/*.dmg
            runtime/mac/dist/*.zip
          if-no-files-found: error
          compression-level: 0

  mac-x64:
    needs: validate
    runs-on: macos-15-intel
    env:
      WURSTER_MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      WURSTER_MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      WURSTER_MAC_NOTARIZE: 'true'
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install

      - name: Require macOS signing and notarization secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WURSTER_MAC_CSC_LINK" || { echo "Missing MAC_CSC_LINK" >&2; exit 1; }
          test -n "$WURSTER_MAC_CSC_KEY_PASSWORD" || { echo "Missing MAC_CSC_KEY_PASSWORD" >&2; exit 1; }
          test -n "$APPLE_ID" || { echo "Missing APPLE_ID" >&2; exit 1; }
          test -n "$APPLE_APP_SPECIFIC_PASSWORD" || { echo "Missing APPLE_APP_SPECIFIC_PASSWORD" >&2; exit 1; }
          test -n "$APPLE_TEAM_ID" || { echo "Missing APPLE_TEAM_ID" >&2; exit 1; }

      - name: Prepare hardened Electron entitlements
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p runtime/desktop/build

          cat > runtime/desktop/build/entitlements.mac.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
          </dict>
          </plist>
          PLIST

          cp runtime/desktop/build/entitlements.mac.plist \
             runtime/desktop/build/entitlements.mac.inherit.plist

          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';

          const file = 'runtime/desktop/package.json';
          const pkg = JSON.parse(await fs.readFile(file, 'utf8'));

          pkg.build ??= {};
          pkg.build.mac ??= {};
          pkg.build.mac.hardenedRuntime = true;
          pkg.build.mac.entitlements = 'build/entitlements.mac.plist';
          pkg.build.mac.entitlementsInherit = 'build/entitlements.mac.inherit.plist';

          await fs.writeFile(file, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Build signed and notarized macOS x64
        run: npm run dist:mac:x64


      - name: Verify signed and notarized app
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/wurster-verify-x64"
          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"

          zip_file=$(find runtime/mac/dist -maxdepth 1 -name 'Wurster-*-mac-x64.zip' -print -quit)
          test -n "$zip_file" || { echo "macOS x64 ZIP not found" >&2; exit 1; }

          ditto -x -k "$zip_file" "$verify_dir"
          app=$(find "$verify_dir" -maxdepth 2 -name 'Wurster.app' -print -quit)
          test -n "$app" || { echo "Wurster.app not found in x64 ZIP" >&2; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --verbose --type exec "$app"
          xcrun stapler validate "$app"

      - uses: actions/upload-artifact@v7
        with:
          name: runtime-mac-x64
          path: |
            runtime/mac/dist/*.dmg
            runtime/mac/dist/*.zip
          if-no-files-found: error
          compression-level: 0

  windows-x64:
    needs: validate
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      WURSTER_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WURSTER_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      WURSTER_WIN_CERTIFICATE_SUBJECT_NAME: ${{ secrets.WIN_CERTIFICATE_SUBJECT_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-windows-x64
          path: |
            runtime/windows/dist/*.exe
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [web, mac-arm64, mac-x64, windows-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-*
          path: release-parts

      - name: Stage release and updater assets
        run: node tools/prepare-release-assets.mjs release-parts release-assets

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --title "Wurster ${GITHUB_REF_NAME#v}" \
            --generate-notes
