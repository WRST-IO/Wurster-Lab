name: Deploy wrst.io

on:
  workflow_run:
    workflows:
      - Release Wurster Runtime
    types:
      - completed
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag or commit to deploy
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           startsWith(github.event.workflow_run.head_branch, 'v')) }}
    runs-on: ubuntu-latest
    env:
      WURSTER_RELEASE_REPOSITORY: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install Wurster Web dependencies
        run: npm ci --workspace @wurster/web

      - name: Install site dependencies
        run: npm ci --prefix site

      - name: Build Wurster Web and sync canonical docs
        run: |
          node tools/wrst-authority.mjs sync
          node runtime/web/build.mjs
          node tools/sync-site-docs.mjs

      - name: Build wrst.io
        run: npm --prefix site run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
